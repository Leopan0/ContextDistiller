# The context-distiller bundle patch: inserts this plugin into the profile
# entry list. Declared via `dsh.bundle.patch` in package.json, so
# `dsh plugin add` reconciles the package into `dsh.profile.bundles` and the
# profile boot applies this layer automatically — no manual cordis.patch.yml
# edit needed.
#
# The patch applies over an empty entry list (bundle layers compose before the
# profile's own cordis.patch.yml), so it is a bare `insert`. The id/name MUST
# equal package.json#name.
#
# `compact.enabled` stays off by default. Enable it through the Plugin
# Manager's config form for this plugin (or a config block here), picking a
# provider/model from the Harness model list — there are no hardcoded defaults.
#
# `filter.flaggedTurns` also stays off by default: when on, conversation turns
# containing an answer the user rated negative (message thumbs-down, the
# `feedback/message-put` session event) are excluded from compaction summaries.
#
# All sections are declared volatile in the config schema, so edits made in the
# settings page apply to the running plugin without a reload and persist
# through the active profile's patch.
- insert:
    - id: context-distiller
      name: context-distiller
      config:
        compact:
          enabled: false
          provider: ''
          model: ''
        filter:
          flaggedTurns: false
        engine:
          enabled: false
